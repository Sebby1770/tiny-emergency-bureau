name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run engine tests
        run: npm test

      # The desk's rules live in bureau-engine.js precisely so they can be
      # tested without a browser; make sure the file stays loadable on its own.
      - name: Check the engine loads standalone
        run: node -e "const e=require('./bureau-engine.js'); if (typeof e.readShiftState !== 'function') { throw new Error('engine export missing'); }"

  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The game ships as plain scripts with no build step, so a syntax error
      # would otherwise only surface in the browser after deploy.
      - name: Syntax-check every shipped script
        run: |
          for file in script.js bureau-engine.js sw.js config.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Validate JSON manifests
        run: |
          for file in package.json manifest.json vercel.json; do
            echo "Checking $file"
            node -e "JSON.parse(require('fs').readFileSync('$file','utf8'))"
          done
